config.llm.ollama.api.key = Clave de API Bearer de Ollama (Opcional para nube)
config.llm.ollama.timeout = Tiempo de espera en segundos para Ollama (predeterminado: 60)
config.llm.retrieval.max_tickets = N\u00famero m\u00e1ximo de tickets recuperados para el contexto de consulta de IA (predeterminado 50)
config.llm.search.expansion.enabled = Habilitar la conversi\u00f3n chino tradicional/simplificado y expansi\u00f3n de sin\u00f3nimos con Ollama
config.llm.search.expansion.timeout = Tiempo de espera en segundos para la expansi\u00f3n de b\u00fasqueda de Ollama (predeterminado: 6)
mail.ai_query.subject_prefix = Re: 
mail.ai_query.offline_notice_subject = [JTrac AI] Servicio fuera de l\u00ednea o tiempo de espera agotado
mail.ai_query.offline_notice_body = El servicio de consulta de IA local est\u00e1 actualmente fuera de l\u00ednea o se agot\u00f3 el tiempo de espera. Por favor intente m\u00e1s tarde o contacte al administrador del sistema.
config.security.privacy.headers.enabled = Habilitar encabezados HTTP de seguridad y privacidad (X-Frame-Options, X-Content-Type-Options, etc.)
config.attachment.index.maxSizeMb = Tama\u00f1o m\u00e1ximo de archivo en MB para indexaci\u00f3n de texto completo de adjuntos (predeterminado 10 MB)
config.attachment.index.maxChars = N\u00famero m\u00e1ximo de caracteres extra\u00eddos para indexaci\u00f3n de adjuntos (predeterminado 50000)
mail.ai_query.zero_hit_subject = [JTrac AI] No se encontraron tickets coincidentes
mail.ai_query.zero_hit_body = En sus espacios de proyecto autorizados, no se encontraron tickets hist\u00f3ricos o adjuntos coincidentes con su consulta.
mail.ai_query.zero_hit_spaces = Sus espacios de proyecto actualmente autorizados:
mail.ai_query.zero_hit_tip = El Asistente de Consulta de IA de JTrac sigue una estricta pol\u00edtica de fundamentaci\u00f3n en datos y no especula sin evidencia interna. Le sugerimos ajustar sus palabras clave o consultar con su administrador.


