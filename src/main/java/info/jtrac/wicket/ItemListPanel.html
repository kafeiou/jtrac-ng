<html>
    <body>
        <wicket:panel>
            <table class="jtrac item-list-toolbar" width="100%">
                <tr>
                    <td class="item-list-toolbar-left">
                        <span wicket:id="count"><img src="resources/search.gif" class="nav-link"/><a href="#"><span wicket:id="count"></span> <span wicket:id="recordsFound"></span></a></span>&nbsp;                
                        <span wicket:id="pagination" class="page-links">
                            <span wicket:id="firstOn"><a href="#" wicket:id="firstOn" wicket:message="title:item_list.first"></a></span><span wicket:id="firstOff" wicket:message="title:item_list.first"></span>
                            <span wicket:id="prevOn"><a href="#" wicket:id="prevOn" wicket:message="title:item_list.prev"></a></span><span wicket:id="prevOff" wicket:message="title:item_list.prev"></span>
                            <span wicket:id="pages" class="page-numbers">
                                <span wicket:id="pageOn"><a href="#" wicket:id="pageOn"></a></span><span wicket:id="pageOff"></span>
                            </span>
                            <span wicket:id="nextOn"><a href="#" wicket:id="nextOn" wicket:message="title:item_list.next"></a></span><span wicket:id="nextOff" wicket:message="title:item_list.next"></span>
                            <span wicket:id="lastOn"><a href="#" wicket:id="lastOn" wicket:message="title:item_list.last"></a></span><span wicket:id="lastOff" wicket:message="title:item_list.last"></span>
                            <span wicket:id="pageInfo" class="page-info"><span wicket:id="pageCurrent" class="page-current"></span><span class="page-separator"> / </span><span wicket:id="pageTotal" class="page-total"></span></span>
                        </span>
                    </td>
                    <td class="item-list-toolbar-right" align="right">
                        <form wicket:id="filterForm" class="item-list-filter-form">
                            <span class="item-list-search-wrap">
                                <span class="item-list-search-icon">🔍</span>
                                <input type="text" wicket:id="filterInput" class="item-list-search-input" wicket:message="placeholder:item_search_form.searchPlaceholder"/>
                            </span>
                        </form>
                    </td>
                </tr>
            </table>
            <div wicket:id="searchKeywordAlert" class="search-keyword-banner">
                <span class="search-keyword-icon">🔍</span>
                <span class="search-keyword-label"><wicket:message key="item_search.searchingFor"/>:</span>
                <strong wicket:id="searchKeywordValue" class="search-keyword-text"></strong>
                <span wicket:id="expandedTermsGroup" class="search-expanded-group">
                    <span class="search-expanded-sep">|</span>
                    <span class="search-expanded-label"><wicket:message key="item_search.expandedTerms"/>:</span>
                    <span wicket:id="expandedTermItem" class="search-expanded-badge"><span wicket:id="termText"></span></span>
                </span>
                <a href="#" wicket:id="clearSearchLink" class="search-keyword-clear" wicket:message="title:item_search.clear">✕</a>
            </div>
            <div class="table-responsive item-list-table-container">
                <table class="jtrac jtrac-list" width="100%">
                    <tr class="sortable">
                        <th wicket:id="headings"><span wicket:id="heading"><a href="#" wicket:id="heading"></a></span></th>                    
                    </tr>
                    <tr wicket:id="itemList">
                        <td wicket:id="columns" valign="top"><span wicket:id="column"></span></td>
                    </tr>
                </table>
            </div>
        </wicket:panel>
        <wicket:fragment wicket:id="refId"><a href="#" wicket:id="refId"><span wicket:id="refId"></span></a><span wicket:id="index"></span></wicket:fragment>
        <wicket:fragment wicket:id="detail"><span wicket:id="attachment"></span><span wicket:id="detail"></span></wicket:fragment>
    </body>
</html>
