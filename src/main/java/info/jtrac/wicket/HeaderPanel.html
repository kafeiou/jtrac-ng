<wicket:panel>
    <div class="nav-header">
        <input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox" aria-label="Toggle navigation"/>
        <div class="nav-mobile-bar">
            <span class="nav-brand-title">JTrac NG</span>
            <div class="nav-mobile-actions">
                <button type="button" class="mobile-search-btn" aria-label="Toggle search" title="Search" onclick="jtracToggleMobileSearch(event)">
                    <span class="search-icon">🔍</span>
                </button>
                <button type="button" class="mobile-font-btn" aria-label="Toggle font scale" title="Toggle font scale (A / A+ / A++ / A+++)" onclick="jtracToggleFontScale(event)">
                    <span class="font-scale-icon">A</span>
                </button>
                <button type="button" class="mobile-theme-btn" aria-label="Toggle theme" title="Toggle theme (Light / Dark / System)" onclick="jtracToggleTheme(event)">
                    <span class="theme-icon">🖥️</span>
                </button>
                <label for="nav-toggle" class="nav-toggle-btn" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
            </div>
        </div>
        <div id="mobile-search-drawer" class="mobile-search-drawer">
            <form wicket:id="mobileSearchForm" class="mobile-search-form">
                <div class="mobile-search-input-wrap">
                    <span class="mobile-search-prefix-icon">🔍</span>
                    <input type="text" wicket:id="mobileSearchInput" class="mobile-search-input" wicket:message="placeholder:item_search_form.searchPlaceholder"/>
                    <button type="submit" class="mobile-search-submit-btn"><wicket:message key="search"/></button>
                    <button type="button" class="mobile-search-close-btn" onclick="jtracToggleMobileSearch(event)" title="Close">✕</button>
                </div>
            </form>
        </div>
        <div class="nav-menu-wrapper">
            <table class="nav-table-left" style="float:left">
                <tr>
                    <td class="action-tab nav-tab-dashboard"><a href="#" wicket:id="dashboard"><img src="resources/dashboard.gif"/><wicket:message key="header.dashboard"/></a></td>
                    <wicket:enclosure child="spaceName"><td class="info-tab nav-tab-space"><span class="nav-item-content"><img src="resources/space.gif"/><span wicket:id="spaceName"></span>&nbsp;<font size="1">[<span wicket:id="prefixCode"></span>]</font></span></td></wicket:enclosure>
                    <wicket:enclosure><td class="action-tab nav-tab-new"><a href="#" wicket:id="new"><img src="resources/new.gif"/><wicket:message key="header.new"/></a></td></wicket:enclosure>
                    <td class="action-tab nav-tab-quicksearch">
                        <form wicket:id="desktopSearchForm" class="desktop-search-form">
                            <span class="desktop-search-wrap">
                                <span class="desktop-search-icon">🔍</span>
                                <input type="text" wicket:id="desktopSearchInput" class="desktop-search-input" wicket:message="placeholder:item_search_form.searchPlaceholder"/>
                                <button type="submit" class="desktop-search-submit-btn"><wicket:message key="search"/></button>
                            </span>
                        </form>
                        <span class="nav-search-divider"></span>
                    </td>
                    <wicket:enclosure><td class="action-tab nav-tab-search"><a href="#" wicket:id="search"><img src="resources/search.gif"/><wicket:message key="header.search"/></a></td></wicket:enclosure>
                </tr>
            </table>         
            <table class="nav-table-right" style="float:right">
                <tr>                                
                    <wicket:enclosure><td class="action-tab nav-tab-export"><a href="#" wicket:id="export"><wicket:message key="header.export"/></a></td></wicket:enclosure>
                    <wicket:enclosure><td class="action-tab nav-tab-options"><img src="resources/options.gif"/><a href="#" wicket:id="options"><wicket:message key="header.options"/></a></td></wicket:enclosure>
                    <wicket:enclosure><td class="action-tab nav-tab-logout"><a href="#" wicket:id="logout"><img src="resources/logout.gif"/><wicket:message key="header.logout"/></a></td></wicket:enclosure>
                    <wicket:enclosure><td class="action-tab nav-tab-login"><a href="#" wicket:id="login"><wicket:message key="header.login"/></a></td></wicket:enclosure>
                    <wicket:enclosure><td class="info-tab nav-tab-user"><span class="nav-item-content"><img src="resources/user.gif"/><span wicket:id="user"></span></span></td></wicket:enclosure>
                    <td class="action-tab nav-tab-font" onclick="jtracToggleFontScale(event)" title="Toggle font scale (A / A+ / A++ / A+++)">
                        <span class="font-scale-icon">A</span>
                    </td>
                    <td class="action-tab nav-tab-theme" onclick="jtracToggleTheme(event)" title="Toggle theme (Light / Dark / System)">
                        <span class="theme-icon">🖥️</span>
                    </td>
                </tr>
            </table>
            <div style="clear:both"></div>
        </div>
    </div>
</wicket:panel>
