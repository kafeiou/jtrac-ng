<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html>
    <head>
        <title wicket:id="title"></title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
        <meta name="robots" content="noindex, nofollow, noarchive, nosnippet"/>
        <link rel="stylesheet" type="text/css" href="resources/jtrac.css"/>
        <link rel="shortcut icon" type="image/x-icon" href="favicon.ico"/>
        <link rel="icon" type="image/x-icon" href="favicon.ico"/>
        <script type="text/javascript">
            //<![CDATA[
            (function() {
                try {
                    var t = localStorage.getItem('jtrac-theme') || 'system';
                    var d = document.documentElement;
                    var effectiveTheme = t;
                    if (t === 'system') {
                        var isDark = (window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false);
                        effectiveTheme = isDark ? 'dark' : 'light';
                    }
                    d.setAttribute('data-theme', effectiveTheme);
                    d.setAttribute('data-theme-mode', t);
                } catch(e) {}
            })();
            //]]>
        </script>
    </head>
    <body>
        <span wicket:id="individuel"></span><br/>
        <table width="100%" class="jtrac alt">
            <tr>
                <td><a href="app"><wicket:message key="logout.home"/></a></td>
                <td align="right">
                    <button type="button" class="login-theme-btn" aria-label="Toggle theme" title="Toggle theme (Light / Dark / System)" onclick="jtracToggleTheme(event)">
                        <span class="theme-icon">🖥️</span>
                    </button>
                </td>
            </tr>
        </table> 
        <div style="padding-bottom:2em"></div>
        <table class="jtrac">
            <tr>
                <td class="info"><wicket:message key="logout.message"/></td>
            </tr>
            <tr>
                <td><br/></td>
            </tr>
            <tr>
                <td class="info" align="center"><a href="app/login"><wicket:message key="logout.login"/></a></td>
            </tr>
        </table>
        <div style="padding-bottom:2em"></div>
        <table width="100%" class="jtrac">
            <tr class="header">
                <td align="right">
                    <i>powered by <a href="https://github.com/kafeiou/jtrac-ng" target="_blank">JTrac NG <span wicket:id="version"></span></a>, forked from <a href="https://sourceforge.net/projects/j-trac/" target="_blank">JTrac</a> 2.3.3</i>
                </td>
            </tr>
        </table>            
    </body>
</html>
