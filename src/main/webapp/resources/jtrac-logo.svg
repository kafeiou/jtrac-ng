<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 44" width="176" height="44" fill="none">
  <defs>
    <linearGradient id="ngGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="capsuleGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0072ff" flood-opacity="0.28"/>
    </filter>
  </defs>
  <style>
    .brand-jtrac {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 29px;
      font-weight: 800;
      fill: #0849c4;
      letter-spacing: -0.5px;
    }
    .brand-ng {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      font-weight: 900;
      fill: #ffffff;
      letter-spacing: 0.8px;
    }
    @media (prefers-color-scheme: dark) {
      .brand-jtrac {
        fill: #60a5fa;
      }
    }
  </style>

  <!-- JTrac Wordmark -->
  <text x="2" y="31" class="brand-jtrac">JTrac</text>

  <!-- Next Generation (NG) Capsule Pill Badge -->
  <g filter="url(#capsuleGlow)">
    <rect x="96" y="9" width="68" height="26" rx="13" fill="url(#ngGrad)"/>
  </g>
  <text x="130" y="28" text-anchor="middle" class="brand-ng">NG</text>
</svg>
